name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync web app into Android
        run: |
          npm ci
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No signing secrets yet: building a test APK only, no release"; echo "SIGNED=" >> "$GITHUB_ENV"; exit 0; fi
          echo "SIGNED=1" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.5.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNED" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/completionist-log.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/completionist-log-test.apk"
          fi

      - name: Keep the test APK
        if: env.SIGNED == ''
        uses: actions/upload-artifact@v4
        with:
          name: completionist-log-test
          path: ${{ runner.temp }}/completionist-log-test.apk

      - name: Publish as a release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.5.${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/completionist-log.apk" \
            --title "Completionist Log $TAG" \
            --notes "${{ github.event.head_commit.message || 'Manual build' }}" \
            --latest

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completionist Log</title>
<meta name="description" content="FFXIV completionist tracker">
<meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* safe areas: Capacitor's injected values on Android, the browser's otherwise */
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px));--sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px))}
/* Layout: one phone-width app column (max 440px) centred on larger screens; four bottom tabs; sheets slide up from the bottom. */
:root{
  --bg:#e9ebf1; --app:#f6f7fa; --surface:#ffffff; --sunk:#eef0f5; --ink:#1a1e2c; --muted:#5c6277; --faint:#9298ab; --line:#dfe2ea;
  --quest:#2f6fe0; --quest-soft:#e3ecfc; --lock:#a3a8b8; --warn:#b4570f;
  --x-arr:#2c66c9; --x-hw:#3f7aa6; --x-sb:#b8322a; --x-shb:#7148bd; --x-ew:#9a7208; --x-dt:#16897a; --x-all:#3a3f55;
  --accent:#8a5a14; --accent-ink:#ffffff;
  --f-display:"Cinzel",Georgia,serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
  --c-jobs:#c0612b; --c-duties:#3a5bd9; --c-gear:#8a6d1a; --c-ranks:#2f8f6b; --c-coll:#b03a7a; --c-story:#6b4bb5; --c-field:#1f7f8f; --c-craft:#6f7f1a; --c-life:#c2406a; --c-games:#c23b3b; --c-pvp:#56688f; --c-hduties:#a13d8f; --c-explore:#2f7d4f; --c-world:#8a5a2b; --c-pastimes:#6a7280; --c-shops:#9b6a12; --gold:#a8790a; --gold-soft:#fbf1d6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0c16; --app:#10131f; --surface:#181c2c; --sunk:#141827; --ink:#e8eaf2; --muted:#9ca2b8; --faint:#6c7288; --line:#272c42;
  --quest:#6ea0ff; --quest-soft:#1b2848; --lock:#5b6075; --warn:#f0a35e;
  --x-arr:#6f9ff2; --x-hw:#86b6da; --x-sb:#ee6e60; --x-shb:#ad90ee; --x-ew:#dcb14e; --x-dt:#4ccdb9; --x-all:#c4c8d8;
  --accent:#e0b25a; --accent-ink:#1a1405; --c-jobs:#f0915a; --c-duties:#7f9bff; --c-gear:#d9b84f; --c-ranks:#5fd0a5; --c-coll:#ec7fbd; --c-story:#a98bf0; --c-field:#4fc6d6; --c-craft:#b6c84a; --c-life:#f07f9f; --c-games:#f27a7a; --c-pvp:#9fb3dc; --c-hduties:#e38ad0; --c-explore:#6fd39a; --c-world:#e0a46a; --c-pastimes:#b4bac6; --c-shops:#e8b65a; --gold:#f2c24e; --gold-soft:#3a2f12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a0c16; --app:#10131f; --surface:#181c2c; --sunk:#141827; --ink:#e8eaf2; --muted:#9ca2b8; --faint:#6c7288; --line:#272c42;
  --quest:#6ea0ff; --quest-soft:#1b2848; --lock:#5b6075; --warn:#f0a35e;
  --x-arr:#6f9ff2; --x-hw:#86b6da; --x-sb:#ee6e60; --x-shb:#ad90ee; --x-ew:#dcb14e; --x-dt:#4ccdb9; --x-all:#c4c8d8;
  --accent:#e0b25a; --accent-ink:#1a1405; --c-jobs:#f0915a; --c-duties:#7f9bff; --c-gear:#d9b84f; --c-ranks:#5fd0a5; --c-coll:#ec7fbd; --c-story:#a98bf0; --c-field:#4fc6d6; --c-craft:#b6c84a; --c-life:#f07f9f; --c-games:#f27a7a; --c-pvp:#9fb3dc; --c-hduties:#e38ad0; --c-explore:#6fd39a; --c-world:#e0a46a; --c-pastimes:#b4bac6; --c-shops:#e8b65a; --gold:#f2c24e; --gold-soft:#3a2f12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:10;background:var(--app)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--app);position:relative;overflow-x:clip;
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:var(--sat) 96px}
@media (min-width:600px){.app{margin-block:24px;min-height:auto;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.15)}}
.sample{font-size:.75rem;color:var(--muted);padding:10px 0 0;margin:0}
.center{text-align:center}

.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:var(--sat);background:var(--app);z-index:4}
.top h1{font-family:var(--f-display);font-size:1.3rem;margin:0;flex:1;min-width:0;letter-spacing:.03em}
.back{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
svg{flex:none}

.panel{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
button.panel{cursor:pointer}
.lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grow{flex:1;min-width:0}
.val{font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--app)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
h2.sh{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
h2.sh span{letter-spacing:0;text-transform:none;font-weight:600}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.85rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;min-height:88px}
.tile .tn{font-weight:700;line-height:1.2}
.tile .ta{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.tile .ta b{color:var(--ink)}
.tq{color:var(--quest);font-weight:600}
.tile.stub{opacity:.75}
.ring{width:38px;height:38px}
.ring text{font:500 10px var(--f-mono);fill:var(--ink)}

.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;margin-top:10px}
.seg button{all:unset;cursor:pointer;flex:1 1 auto;text-align:center;padding:6px 6px;white-space:nowrap;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted);padding:8px 0 0}
.legend span{display:inline-flex;gap:5px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:10px;padding:11px 12px;align-items:flex-start;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.body{flex:1;min-width:0}
.nm{font-weight:600}
.sub{font-size:.8rem;color:var(--muted);margin-top:1px}
.item.locked .nm{color:var(--faint)}
.item.done .nm{color:var(--muted)}
.xtag{font:500 .68rem var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid currentColor;margin-left:6px;vertical-align:1px;white-space:nowrap}
.st{width:24px;height:24px;flex:none;margin-top:1px}
.stbtn{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:50%}
.turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.turn{all:unset;cursor:pointer;font:500 .78rem var(--f-mono);padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--sunk)}
.turn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pinbtn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--faint);flex:none}
.pinbtn[aria-pressed="true"]{color:var(--accent)}

/* unlock chain */
.chain{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.chain li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:.8rem;color:var(--muted);position:relative;padding-bottom:6px}
.chain li::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--lock);margin:4px 0 0 2px;background:var(--surface)}
.chain li:not(:last-child)::after{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.chain li.now{color:var(--quest)}
.chain li.now::before{border-color:var(--quest);background:var(--quest)}
.chain li.msq::before{border-radius:2px;border-color:var(--warn)}
.chain li.msq{color:var(--warn)}
.chain b{color:inherit}
.qbtn{all:unset;cursor:pointer;font-size:.75rem;font-weight:700;color:var(--quest);padding:2px 9px;border:1px solid var(--quest);border-radius:999px;margin-left:6px}

/* ladders, steppers */
.ladder{display:flex;gap:4px;align-items:center}
.rung{all:unset;cursor:pointer;width:22px;height:8px;border-radius:4px;background:var(--line)}
.rung.on{background:var(--accent)}
.ladlbl{font-size:.78rem;color:var(--muted);margin-left:6px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:6px}
.sbtn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:700}
.sval{cursor:pointer;font:500 1rem var(--f-mono);min-width:32px;text-align:center}
.advance{all:unset;cursor:pointer;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-align:center}
.ghost{all:unset;cursor:pointer;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);text-align:center}
.track{display:flex;gap:3px;min-width:0}
.pip{all:unset;cursor:pointer;flex:1;height:12px;border-radius:3px;background:var(--line);min-width:0}
.pip.on{background:var(--accent)}
.jobrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.jobrow:first-child{border-top:0}
.lvbar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--accent)}

/* goals */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.goal .gh{display:flex;gap:8px;align-items:flex-start}
.goal .gt{font-weight:700;flex:1;min-width:0}
.note{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:7px 9px;font-size:.85rem}

/* collections */
.ownrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.ownrow:first-child{border-top:0}
.own{all:unset;cursor:pointer;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.own[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.own svg{opacity:0}.own[aria-checked="true"] svg{opacity:1}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:10px}
.collgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* timers */
.tm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}
.tm:first-child{border-top:0}
.cd{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.ready{color:var(--accent)}
.bell{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--faint)}
.bell[aria-pressed="true"]{color:var(--accent)}
.opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:6px;grid-column:1/-1}
.field input[type=number]{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:var(--f-mono)}
.field select,.field input[type=time]{padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* sheets, nav, toast */
.scrim{position:fixed;inset:0;background:rgba(5,7,15,.45);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;max-height:85vh;overflow:auto;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px max(16px,var(--sar)) calc(20px + var(--sab)) max(16px,var(--sal));animation:up .2s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);margin:0 0 4px;font-size:1.15rem}
.help{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.exph{font-weight:700;margin:14px 0 4px;display:flex;align-items:center;gap:4px}
.chap{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 2px 10px}
.patch{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:9px}
.patch[aria-pressed="true"]{background:var(--quest-soft)}
.patch .pn{font:500 .78rem var(--f-mono);color:var(--muted);width:30px;flex:none}
.patch.past .pt{color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sw{all:unset;cursor:pointer;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:21px}
.wide{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;padding:12px;border-radius:10px;background:var(--ink);color:var(--app);font-weight:700;margin-top:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.opt:hover{border-color:var(--accent)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:10;
  padding:6px max(16px,var(--sar)) calc(6px + var(--sab)) max(16px,var(--sal))}
@media (min-width:600px){.nav{position:sticky;bottom:0;transform:none;left:auto;border-radius:0 0 28px 28px;margin-top:20px;width:auto;margin-left:calc(-1 * max(16px,var(--sal)));margin-right:calc(-1 * max(16px,var(--sar)))} .app{padding-bottom:0}}
.nav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
.nav button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--quest);color:#fff;font:700 .62rem var(--f-body);border-radius:999px;padding:1px 5px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.stubmsg{padding:24px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
.stubmsg b{display:block;color:var(--ink);margin-bottom:4px}
.cgrid{display:grid;gap:4px;align-items:center;min-width:300px}
.cgrid .ch{font:600 .75rem var(--f-mono);color:var(--muted);text-align:center}
.cgrid .job{font:500 .75rem var(--f-mono);line-height:1.1}
.cgrid .job small{display:block;color:var(--faint);font-size:.62rem}
.cell{all:unset;cursor:pointer;height:30px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--ink);text-align:center;line-height:30px;font-variant-numeric:tabular-nums}
.cell.on{color:var(--accent-ink)}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell:disabled{cursor:default;opacity:.45;color:var(--muted)}
.cell:focus-visible{outline:2px solid var(--accent)}
.kind{font:600 .66rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--quest);border:1px solid var(--quest);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px}
.leads{display:flex;flex-direction:column;gap:3px;margin-top:5px;font-size:.82rem}
.nmbtn{all:unset;cursor:pointer;font-weight:600}
.nextq{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -2px;border-radius:12px;background:var(--quest-soft)}
.nextq .lbl{color:var(--quest)}
.msqhead{position:sticky;top:-1px;z-index:2;background:var(--surface);padding-top:4px}
.msqchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.msqchips .chip{flex:0 0 auto;padding:5px 10px;font-size:.78rem}
.item.one{align-items:center;padding:9px 12px;gap:10px}
.item.one .nmbtn{flex:1;min-width:0;line-height:1.25}
.item.one .lk{flex:1;min-width:0;font-weight:600;color:var(--faint);cursor:pointer;all:unset;flex:1;line-height:1.25}
.cc{font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qtag{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--quest);white-space:nowrap}
.feed{display:flex;flex-direction:column;gap:0}
.feed .fh{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 2px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.feed .fh button{all:unset;cursor:pointer;letter-spacing:0;text-transform:none;font-size:.78rem;color:var(--accent);font-weight:700}
.fi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px}
.fi .grow{flex:1;min-width:0}.fi .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi .s{font-size:.78rem;color:var(--muted)}
.fi .w{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.tiles.mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.mini .tile{padding:9px;min-height:0;grid-template-columns:1fr auto;gap:2px 4px}
.tiles.mini .tile .tn{font-size:.8rem}
.tiles.mini .ring{width:28px;height:28px}
.tiles.mini .tile .ta{font-size:.7rem}

/* Unlock chain: walks quest -> prerequisite quest ... -> story milestone. Returns steps (first step to do first) and status. */
function chainFor(qid){
  const steps = []; let cur = qid, guard = 0, msqBlock = null;
  while (cur && guard++ < 20){
    const q = Q[cur]; if (q.done) break;
    steps.unshift({type:'quest', id:cur, q});
    if (q.msq && !msqDone(q.msq)) msqBlock = q.msq;
    cur = q.req;
  }
  // story requirement: the deepest unfinished quest's milestone, or any milestone up the chain
  if (msqBlock) steps.unshift({type:'msq', id:msqBlock});
  const lvNeed = steps.filter(s=>s.type==='quest' && s.q.lv).map(s=>s.q.lv).reduce((a,b)=>Math.max(a,b),0);
  if (lvNeed > highLv()) steps.unshift({type:'lv', lv:lvNeed});
  return {steps, msqBlock, lvBlock: lvNeed > highLv()};
}
/* Status: done | prog | avail | quest (story clear, needs quest chain) | locked (story or level blocks) */
function dStatus(d){
  if (d.msq && !msqDone(d.msq)) return 'locked';
  if (d.q){ const c = chainFor(d.q); if (c.steps.length){ return (c.msqBlock || c.lvBlock) ? 'locked' : 'quest'; } }
  if (d.turns){ const n = d.td.filter(Boolean).length; return n===d.turns.length?'done':n?'prog':'avail'; }
  return d.done ? 'done' : 'avail';
}
function chainHTML(qid, direct){

}

function unlocksOf(qid){

  const out = [];
  DUTIES.forEach(d => { if (d.q && leads(d.q)) out.push({n:d.n, kind:KIND[d.g]}); });
  JOBS.forEach(([,js]) => js.forEach(j => { if (j[3] && leads(j[3])) out.push({n:j[1], kind:'Job'}); }));
  EXTRA_UNLOCKS.forEach(([q,n,k]) => { if (leads(q)) out.push({n, kind:k}); });
  Object.entries(Q).forEach(([id,q]) => { if (q.req===qid) out.push({n:q.n, kind:'Quest'}); });
  return out;
}

function availableQuests(){

    if (!seen.has(first.id)) seen.set(first.id, {q:first.q, id:first.id, unlocks:[]}); seen.get(first.id).unlocks.push({n,kind}); };
  DUTIES.forEach(d => { if (d.q && !(d.msq && !msqDone(d.msq))) add(d.q, d.n, KIND[d.g]); });
  JOBS.forEach(([,js]) => js.forEach(j => { if (j[3]) add(j[3], j[1], 'Job'); }));
  EXTRA_UNLOCKS.forEach(([q,n,k]) => add(q,n,k));

function goalCard(id){

  const note = `<input class="note" data-note="${id}" placeholder="Add a note" value="${esc(S.notes[id]||'')}" aria-label="Note">`;
  if (id.startsWith('relic:')){ const j = id.split(':')[1], s = RS[j]||0;
    return `<div class="goal"><div class="gh"><div class="gt">Zodiac weapon · ${j}<div class="sub">${s?'Now: '+RELIC.st[s-1]:'Not started'}</div></div>${unpin}</div>
      <div class="track">${RELIC.st.map((_,i)=>`<span class="pip ${i<s?'on':''}" style="cursor:default"></span>`).join('')}</div>
      ${s<8?`<button class="advance" data-adv="${j}">Reached ${RELIC.st[s]}</button>`:''}${note}</div>`; }
  const dv = DELIV.find(x=>x.id===id);
  if (dv) return `<div class="goal"><div class="gh"><div class="gt">${esc(dv.n)}<div class="sub">Custom Deliveries · rank ${dv.r} of 5</div></div>${unpin}</div>${ladder(id,dv.r,5)}${note}</div>`;
  const d = DUTIES.find(x=>x.id===id);
  if (d) return `<div class="goal"><div class="gh"><div class="gt">${esc(d.n)}<div class="sub">${d.turns?d.td.filter(Boolean).length+' of '+d.turns.length+' cleared':'Duty'}</div></div>${unpin}</div>
    ${d.turns?turnChips(d):`<button class="advance" data-done="${id}">Mark cleared</button>`}${note}</div>`;
  if (id.startsWith('job:')){ const j = id.slice(4), t = S.targets[id], cur = jobLv(j), nmj = JN[j] || JOBS.flatMap(x=>x[1]).find(x=>x[0]===j)[1];

      <span class="lvbar"><i style="width:${pr*100}%"></i></span><span class="stepper" style="align-self:flex-start"><button class="sbtn" data-${CLV[j]!=null?'clv':'lv'}="${j}:-1" aria-label="Lower">−</button><span class="sval">${cur}</span><button class="sbtn" data-${CLV[j]!=null?'clv':'lv'}="${j}:1" aria-label="Raise">+</button></span>${note}</div>`; }
  if (id.startsWith('log:')){ const t = S.targets[id]; const d = t.cells.filter(k=>C.has(k)).length; const [,seg,x] = id.split(':');
    return `<div class="goal"><div class="gh"><div class="gt">${EXP[x][0]} ${{recipes:'crafting log',furn:'furnishing recipes',gather:'gathering log'}[seg]}<div class="sub">${d} of ${t.cells.length} goal brackets done · tap a bracket when you finish it</div></div>${unpin}</div>
      <span class="lvbar"><i style="width:${d*100/t.cells.length}%"></i></span>
      <button class="grp" style="padding:4px 0" data-grp="goal:${esc(id)}" aria-expanded="${S.open.has('goal:'+id)}">${CHEV}<span class="gn" style="font-weight:600;font-size:.88rem">${S.open.has('goal:'+id)?'Hide':'Show'} classes and brackets</span></button>
      ${!S.open.has('goal:'+id) ? '' : `<div class="card" style="border-radius:10px">${(()=>{ const by = {}; t.cells.forEach(k=>{ const [,,jj,ii] = k.split(':'); (by[jj] = by[jj]||[]).push([k,+ii]); });
        const br = BR[x], top = ii => ii<br.length ? br[ii]+4 : CAP[x];
        const lbl = ii => ii<br.length ? `Lv ${br[ii]}–${br[ii]+4}` : (seg==='gather'?'Unspoiled nodes':'★ recipes');
        return Object.entries(by).map(([jj,cs])=>{ const goalLv = Math.max(...cs.map(([,ii])=>top(ii))), dn = cs.filter(([k])=>C.has(k)).length;
          return `<div class="item" style="flex-direction:column;gap:6px"><div style="display:flex;gap:8px;align-items:baseline;width:100%"><b style="flex:1">${JN[jj]}</b><span class="cd">${dn}/${cs.length}</span></div>
            <div class="sub" style="margin:0">Now Lv ${CLV[jj]} · goal: ${seg==='gather'?'gathering':seg==='furn'?'furnishing':'crafting'} log through Lv ${goalLv}${CLV[jj] < goalLv ? ` <span style="color:var(--warn)">(needs Lv ${goalLv})</span>` : ''}</div>
            <div class="turns" style="margin:0">${cs.map(([k,ii])=>`<button class="turn" aria-pressed="${C.has(k)}" data-c="${k}">${lbl(ii)}</button>`).join('')}</div></div>`; }).join(''); })()}</div>`}
      <button class="ghost" data-goview="${esc(id)}">Open the full log</button>${note}</div>`; }
  const mt = META[id];
  if (mt) return `<div class="goal"><div class="gh"><div class="gt">${esc(mt.t)}<div class="sub">${mt.reg?'Checklist':'Tracker'}</div></div>${unpin}</div><button class="ghost" data-goview="${esc(id)}">Open</button>${note}</div>`;
  return '';
}

  const T = S.timers, now = Date.now(), plan = [];

  if (T.squadron.alarm && T.squadron.end) add(1500, 'Adventurer Squadron', 'Your squadron is back from its command mission', new Date(T.squadron.end));

  return plan;
}
async function syncNotifs(force){

    const plan = planNotifs(), sig = JSON.stringify(plan.map(p=>[p.id,p.at.getTime(),p.title,p.body]));

    }

    const pend = (await LN.getPending()).notifications.filter(n => +n.id !== 9999); if (pend.length) await LN.cancel({notifications: pend.map(n=>({id:n.id}))});

  }
  const blob = new Blob([text], {type: name.endsWith('.json') ? 'application/json' : 'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function exportBackup(){
  writeStore();
  try { await shareFile(`completionist-log-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:'completionist-log', ...STATE}, null, 1), 'Completionist Log backup'); }
  catch(e){ toast('Couldn\'t create the backup file'); }
}
function importBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return;
    try { const st = JSON.parse(await f.text()); if (st.app!=='completionist-log' || st.v!==1) throw new Error('not a backup');
      const before = JSON.stringify(STATE); loadState(st); S.onboard = false; writeStore(); S.view = S.tab = 'home'; render();
      toast('Backup restored', () => { loadState(JSON.parse(before)); writeStore(); render(); });
    } catch(e){ toast('That file isn\'t a Completionist Log backup'); } };
  inp.click();
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
loadState(readStore());
if (S.start && S.start!=='home'){ S.tab = S.view = S.start; }
notifStart();
setInterval(() => { if (S.view==='timers' && !S.addingRem && !document.activeElement?.matches('input,select')) render(); }, 30000);
render();
})();
</script>
<script>
// Android app shell: the hardware back button steps back inside the app instead of closing it
(function(){
  const cap = window.Capacitor; if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
  const App = cap.Plugins && cap.Plugins.App; if (!App) return;
  App.addListener('backButton', () => {
    const layer = document.getElementById('layer');
    if (layer && layer.innerHTML.trim()){ document.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape'})); return; }
    const back = document.querySelector('#app .back'); if (back){ back.click(); return; }
    const home = document.querySelector('.nav [data-tab="home"]');
    if (home && !home.hasAttribute('aria-current')){ home.click(); return; }
    App.exitApp();
  });
})();
</script>
